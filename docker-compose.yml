version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: workflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - workflow-network

  # Backend Server
  server:
    build: ./server
    container_name: workflow-server
    ports:
      - "3001:3000" # Expose on 3001 to avoid conflict with local dev (3000)
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/workflow_db
      - JWT_SECRET=super_secret_enterprise_key_change_me
    depends_on:
      - mongo
    networks:
      - workflow-network
    volumes:
      - server-uploads:/app/uploads

  # Frontend Client
  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=""
    container_name: workflow-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge

volumes:
  mongo-data:
  server-uploads:
