apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: workflow-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/workflow_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: jwt-secret
          volumeMounts:
            - name: server-uploads
              mountPath: /app/uploads
      volumes:
        - name: server-uploads
          persistentVolumeClaim:
            claimName: server-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  type: ClusterIP
  selector:
    app: server
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: workflow-secrets
type: Opaque
data:
  # Base64 encoded 'super_secret_enterprise_key_change_me'
  jwt-secret: c3VwZXJfc2VjcmV0X2VudGVycHJpc2Vfa2V5X2NoYW5nZV9tZQ==
